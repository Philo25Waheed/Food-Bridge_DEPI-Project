<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Food Bridge</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: var(--color-bg-light);">

  <!-- Navbar Simple -->
  <nav class="navbar public-navbar py-2 border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon-wrapper" style="width: 36px; height: 36px; font-size: 1.1rem;"><i class="bi bi-tree-fill"></i></div>
        <div class="brand-title">
          <span class="main-text fw-bold">Food Bridge</span>
          <span class="sub-text">Food Donation Platform</span>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-ghost p-1 px-2 theme-toggle-btn" onclick="EcoTheme.toggle()" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <button class="btn btn-sm btn-ghost p-1 px-2 lang-toggle-btn" onclick="EcoLang.set(EcoLang.get() === 'ar' ? 'en' : 'ar')" title="Switch Language" aria-label="Switch Language">
          <i class="bi bi-translate me-1"></i> <span class="current-lang-text">العربية</span>
        </button>
        <a href="register.html" class="btn btn-sm btn-ghost">Create an Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="eco-card p-4 p-sm-5 bg-white shadow-md">
            <div class="text-center mb-4">
              <div class="brand-icon-wrapper mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                <i class="bi bi-person-lock"></i>
              </div>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-secondary small">Sign in to your Food Bridge account to manage your listings and requests.</p>
            </div>

            <!-- Demo Persona Fast Login Box -->
            <div class="p-3 mb-4 rounded-3" style="background-color: var(--color-primary-light); border: 1px dashed var(--color-primary);">
              <div class="fw-bold text-success small mb-2 d-flex align-items-center gap-1">
                <i class="bi bi-lightning-charge-fill"></i> Instant Demo 1-Click Login:
              </div>
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-sm btn-outline-success text-start bg-white btn-demo-login" data-role="donor">
                  <i class="bi bi-shop me-2 text-success"></i> <strong>Donor:</strong> GreenBites Organic Bistro
                </button>
                <button type="button" class="btn btn-sm btn-outline-success text-start bg-white btn-demo-login" data-role="charity">
                  <i class="bi bi-heart-pulse me-2 text-info"></i> <strong>Charity:</strong> Hope Community Pantry
                </button>
                <button type="button" class="btn btn-sm btn-outline-success text-start bg-white btn-demo-login" data-role="admin">
                  <i class="bi bi-shield-lock me-2 text-primary"></i> <strong>Admin:</strong> Food Bridge Operations HQ
                </button>
              </div>
            </div>

            <div class="position-relative text-center my-3">
              <hr class="text-muted">
              <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">or log in with email</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="name@organization.org" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label for="loginPassword" class="form-label">Password</label>
                  <a href="#" class="small text-decoration-none" onclick="EcoToast.show('Mock password reset email sent to your address.', 'info'); return false;">Forgot?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary border-start-0 bg-white password-toggle-btn" type="button" aria-label="Toggle password visibility">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label text-secondary small" for="rememberMe">
                  Remember my session on this device
                </label>
              </div>

              <button type="submit" class="btn btn-primary-eco w-100 justify-content-center py-2 fs-6">
                <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
              </button>
            </form>

            <div class="text-center mt-4">
              <p class="text-secondary small mb-0">
                New to Food Bridge? <a href="register.html" class="fw-bold text-success text-decoration-none">Create an Account</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Simple -->
  <footer class="py-3 text-center text-muted small border-top bg-white">
    <div class="container">
      &copy; 2026 Food Bridge. Interactive Frontend Prototype.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
